{% extends "base.html" %}{% block title %}Sign in · Langston Student Planner{% endblock %}{% block content %}<section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><p class="muted">Continue planning your high school journey.</p>{% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" value="{{ email }}" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><p class="switch">New here? <a href="/register">Create a student account</a></p></section>{% endblock %}
